services:
  viewer:
    build:
      context: ..
      dockerfile: viewer_project/Dockerfile
      network: host
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
    image: tactile-defect-viewer:humble
    working_dir: /app
    command: ["python3", "main.py"]
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      CAMERA_DEVICE: ${CAMERA_DEVICE:-/dev/video0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-~/.Xauthority}:/tmp/.Xauthority:ro
      - /dev:/dev
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./exports:/app/exports:rw
    device_cgroup_rules:
      - 'c 81:* rmw'   # V4L2 video devices (/dev/video*)
      - 'c 189:* rmw'  # USB devices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true

  rviz:
    profiles: ["rviz"]
    build:
      context: ..
      dockerfile: viewer_project/Dockerfile.rviz
      network: host
    image: tactile-rviz:humble
    network_mode: host
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-~/.Xauthority}:/tmp/.Xauthority:ro
      - ./rviz/gs_pointcloud.rviz:/rviz/gs_pointcloud.rviz:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["rviz2", "-d", "/rviz/gs_pointcloud.rviz"]